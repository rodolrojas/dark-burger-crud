services:
  app:
    image: shinsenter/laravel:latest
    container_name: dark-burger-crud-app
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_HTTPS_PORT:-8443}:443"
    environment:
      APP_NAME: "${APP_NAME}"
      APP_ENV: "${APP_ENV}"
      APP_DEBUG: "${APP_DEBUG}"
      APP_URL: "${APP_URL}"
      APP_PATH: /var/www/html
      DOCUMENT_ROOT: public
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: "${POSTGRES_DB}"
      DB_USERNAME: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME}"
      LARAVEL_AUTO_MIGRATION: "${LARAVEL_AUTO_MIGRATION}"
      LARAVEL_AUTO_MIGRATION_OPTIONS: "${LARAVEL_AUTO_MIGRATION_OPTIONS}"
      LARAVEL_ENABLE_QUEUE_WORKER: "${LARAVEL_ENABLE_QUEUE_WORKER}"
      LARAVEL_QUEUE_WORKER_OPTIONS: "${LARAVEL_QUEUE_WORKER_OPTIONS}"
      LARAVEL_ENABLE_SCHEDULER: "${LARAVEL_ENABLE_SCHEDULER}"
    volumes:
      - ./app:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - dark-burger-crud

  postgres:
    image: postgres:16-alpine
    container_name: dark-burger-crud-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dark-burger-crud

  redis:
    image: redis:7-alpine
    container_name: dark-burger-crud-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dark-burger-crud

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: dark-burger-crud-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - dark-burger-crud

volumes:
  postgres-data:
  redis-data:

networks:
  dark-burger-crud:
    name: dark-burger-crud
    driver: bridge
